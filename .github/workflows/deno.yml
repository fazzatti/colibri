# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow runs workspace quality checks and every package test suite,
# aggregates their coverage profiles, and publishes one Codecov report.
# For more information see: https://github.com/denoland/setup-deno

name: CI

on:
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Test release rules and validate reviewed version plan
        run: |
          deno task check:release-tooling
          deno task test:releases
          deno task release:check --base origin/main

      - name: Check reviewed public declarations
        id: public-api
        run: deno task release:api:check > "${{ runner.temp }}/public-api-changes.json"

      - name: Upload public API change report
        if: ${{ !cancelled() && steps.public-api.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-api-changes
          path: ${{ runner.temp }}/public-api-changes.json
          if-no-files-found: error
          retention-days: 7

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Test architecture rules
        run: deno task test:architecture

      - name: Inventory error boundaries
        run: deno task inspect:error-boundaries > "${{ runner.temp }}/error-boundaries.json"

      - name: Upload error boundary inventory
        uses: actions/upload-artifact@v4
        with:
          name: error-boundaries
          path: ${{ runner.temp }}/error-boundaries.json
          if-no-files-found: error
          retention-days: 7

      - name: Test custom lint rules
        run: deno task test:lint-rules

      - name: Check package version invariants
        run: deno task check:package-versions

      - name: Run linter
        run: deno lint

      - name: Run type checks
        run: deno task check

      - name: Run JSR entrypoint checks
        run: deno task check:jsr

      - name: Check publishable type surfaces
        run: deno task check:slow-types

      - name: Check GitBook documentation and examples
        run: |
          deno task test:docs
          deno task check:docs

  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set compatibility output directory
        run: echo "COMPATIBILITY_DIR=$RUNNER_TEMP/compatibility" >> "$GITHUB_ENV"
      - name: Setup repo and release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Deno 2.9.6
        id: deno-current
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Setup Node 24
        id: node-current
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test compatibility reporting and failure propagation
        run: deno task test:compatibility-runner
      - name: Resolve minimum and latest compatible SDK versions
        id: plan
        run: deno task check:consumers:ci plan "$COMPATIBILITY_DIR"
      # Preserve fail-fast:false semantics inside one check: independent phases
      # continue after failures, and the final summary rejects missing cases.
      - name: Prepare reusable npm artifacts
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci prepare "$COMPATIBILITY_DIR"
      - name: Check released Core dependency ranges
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci dependencies "$COMPATIBILITY_DIR"
      - name: Check Deno 2.9.6 consumers
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci deno-2.9.6 "$COMPATIBILITY_DIR"
      - name: Check Node 24 with both TypeScript versions
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci node-24 "$COMPATIBILITY_DIR"
      - name: Check Chromium, Firefox and WebKit
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci browsers "$COMPATIBILITY_DIR"
      - name: Check production bundle budgets and isolation
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci bundles "$COMPATIBILITY_DIR"
      - name: Check browser failure diagnostics and cleanup
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        run: deno task check:consumers:ci browser-runner "$COMPATIBILITY_DIR"
      - name: Setup Node 22
        id: node-22
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Node 22 with both TypeScript versions
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.node-22.outcome == 'success' }}
        run: deno task check:consumers:ci node-22 "$COMPATIBILITY_DIR"
      - name: Setup Node 22.12.0
        id: node-22-12-0
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Check Node 22.12.0 with both TypeScript versions
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.node-22-12-0.outcome == 'success' }}
        run: deno task check:consumers:ci node-22.12.0 "$COMPATIBILITY_DIR"
      - name: Setup Deno 2.7.11
        id: deno-minimum
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11
      - name: Check Deno 2.7.11 consumers
        if: ${{ !cancelled() && steps.plan.outcome == 'success' && steps.deno-minimum.outcome == 'success' }}
        run: deno task check:consumers:ci deno-2.7.11 "$COMPATIBILITY_DIR"
      - name: Summarize every required compatibility case
        if: always()
        run: deno task check:consumers:ci summary "$COMPATIBILITY_DIR"
      - name: Upload compatibility results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-results
          path: |
            ${{ runner.temp }}/compatibility/plan.json
            ${{ runner.temp }}/compatibility/summary.md
            ${{ runner.temp }}/compatibility/results/
            ${{ runner.temp }}/compatibility/logs/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload production bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-bundles
          path: |
            ${{ runner.temp }}/compatibility/bundles/*.json
            ${{ runner.temp }}/compatibility/bundles/*.lock
            ${{ runner.temp }}/compatibility/bundles/deno/
            ${{ runner.temp }}/compatibility/bundles/rollup/
            ${{ runner.temp }}/compatibility/bundles/npm/package-lock.json

  package_tests:
    name: test / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            path: core
            test_flags: --parallel
          - package: webauth
            path: webauth
            test_flags: --parallel
          - package: contract-bindings
            path: contract-bindings
            test_flags: --parallel
          - package: identicon
            path: identicon
            test_flags: --parallel
          - package: rpc-streamer
            path: rpc-streamer
            # Both Mainnet suites share the public archive provider. Avoid
            # concurrent requests from separate test-file workers.
            test_flags: ""
          - package: plugin-fee-bump
            path: plugins/fee-bump
            test_flags: --parallel
          - package: plugin-channel-accounts
            path: plugins/channel-accounts
            test_flags: --parallel
          - package: plugin-sep29
            path: plugins/sep29
            test_flags: --parallel
          - package: test-tooling
            path: test-tooling
            test_flags: --parallel

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Run ${{ matrix.package }} tests
        env:
          COLIBRI_TEST_QUICKSTART_DIAGNOSTICS: ${{ matrix.package == 'webauth' && '1' || '' }}
        run: |
          set -o pipefail
          deno test -A --clean ${{ matrix.test_flags }} \
            --coverage=coverage/${{ matrix.package }} --coverage-raw-data-only \
            ${{ matrix.path }} 2>&1 | tee "${{ runner.temp }}/package-tests.log"

      - name: Upload WebAuth Quickstart diagnostics
        if: always() && matrix.package == 'webauth'
        uses: actions/upload-artifact@v4
        with:
          name: webauth-quickstart-diagnostics
          path: ${{ runner.temp }}/package-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ${{ matrix.package }} coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/${{ matrix.package }}/*.json
          if-no-files-found: error
          retention-days: 1

  build_verification_tests:
    name: test / build-verification / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: local
            test_flags: >-
              --parallel
              --ignore=build-verification/src/network-targets.integration.test.ts
              --ignore=build-verification/src/build-verification.testnet.integration.test.ts
              --ignore=build-verification/src/public-sources.integration.test.ts
            test_paths: build-verification
          - shard: quickstart
            test_flags: ""
            test_paths: build-verification/src/network-targets.integration.test.ts
          - shard: external
            test_flags: --parallel
            test_paths: >-
              build-verification/src/build-verification.testnet.integration.test.ts
              build-verification/src/public-sources.integration.test.ts

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Run build-verification ${{ matrix.shard }} tests
        run: >-
          deno test -A --clean ${{ matrix.test_flags }}
          --coverage=coverage/build-verification-${{ matrix.shard }}
          --coverage-raw-data-only ${{ matrix.test_paths }}

      - name: Upload build-verification ${{ matrix.shard }} coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build-verification-${{ matrix.shard }}
          path: coverage/build-verification-${{ matrix.shard }}/*.json
          if-no-files-found: error
          retention-days: 1

  complexity:
    name: quality / complexity
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Generate unit coverage
        run: deno task test:unit

      - name: Generate unit coverage report
        run: deno coverage --lcov --output=coverage.lcov coverage

      - name: Enforce CRAP threshold
        run: deno task check:crap

  coverage:
    name: coverage
    needs: [package_tests, build_verification_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Download package coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Prime instrumented source cache
        run: >-
          deno test -A
          --filter='__coverage_cache_prime_never_matches__'
          --coverage=coverage-prime --coverage-raw-data-only
          core build-verification contract-bindings identicon webauth rpc-streamer
          plugins/fee-bump plugins/channel-accounts plugins/sep29 test-tooling

      - name: Generate aggregate coverage report
        run: deno coverage --lcov --output=coverage.lcov coverage/coverage-*

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.lcov
          flags: all-tests
          name: codecov-aggregate
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: test
    if: ${{ always() }}
    needs: [
      quality,
      compatibility,
      complexity,
      package_tests,
      build_verification_tests,
      coverage,
    ]
    runs-on: ubuntu-latest

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
          PACKAGE_TESTS_RESULT: ${{ needs.package_tests.result }}
          BUILD_VERIFICATION_TESTS_RESULT: ${{ needs.build_verification_tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$COMPLEXITY_RESULT" = "success"
          test "$PACKAGE_TESTS_RESULT" = "success"
          test "$BUILD_VERIFICATION_TESTS_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
