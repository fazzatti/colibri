# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow runs workspace quality checks and every package test suite,
# aggregates their coverage profiles, and publishes one Codecov report.
# For more information see: https://github.com/denoland/setup-deno

name: CI

on:
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Test release rules and validate reviewed version plan
        run: |
          deno task check:release-tooling
          deno task test:releases
          deno task release:check --base origin/main

      - name: Check reviewed public declarations
        id: public-api
        run: deno task release:api:check > "${{ runner.temp }}/public-api-changes.json"

      - name: Upload public API change report
        if: ${{ !cancelled() && steps.public-api.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: public-api-changes
          path: ${{ runner.temp }}/public-api-changes.json
          if-no-files-found: error
          retention-days: 7

      # Uncomment this step to verify the use of 'deno fmt' on each commit.
      # - name: Verify formatting
      #   run: deno fmt --check

      - name: Test architecture rules
        run: deno task test:architecture

      - name: Inventory error boundaries
        run: deno task inspect:error-boundaries > "${{ runner.temp }}/error-boundaries.json"

      - name: Upload error boundary inventory
        uses: actions/upload-artifact@v4
        with:
          name: error-boundaries
          path: ${{ runner.temp }}/error-boundaries.json
          if-no-files-found: error
          retention-days: 7

      - name: Test custom lint rules
        run: deno task test:lint-rules

      - name: Check package version invariants
        run: deno task check:package-versions

      - name: Run linter
        run: deno lint

      - name: Run type checks
        run: deno task check

      - name: Run JSR entrypoint checks
        run: deno task check:jsr

      - name: Check publishable type surfaces
        run: deno task check:slow-types

      - name: Check GitBook documentation and examples
        run: |
          deno task test:docs
          deno task check:docs

  prepare_consumers:
    name: prepare consumers / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["17.0.1", "^17.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build portable npm consumer artifacts once
        env:
          STELLAR_SDK_VERSION: ${{ matrix.sdk }}
        run: deno task prepare:consumers "${{ runner.temp }}/consumers"
      - uses: actions/upload-artifact@v4
        with:
          name: consumers-${{ matrix.sdk }}
          path: ${{ runner.temp }}/consumers
          if-no-files-found: error
          retention-days: 1

  compatibility:
    name: consumer / Node ${{ matrix.node }} / TS ${{ matrix.typescript }} / SDK ${{ matrix.sdk }}
    needs: prepare_consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "22", "24"]
        typescript: ["5.9.3", "6.0.3"]
        sdk: ["17.0.1", "^17.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: consumers-${{ matrix.sdk }}
          path: ${{ runner.temp }}/consumers
      - name: Compile and execute installed consumers
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
        run: deno task check:consumers:npm "${{ runner.temp }}/consumers"

  deno_compatibility:
    name: consumer / Deno ${{ matrix.deno }} / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deno: ["2.7.11", "2.9.6"]
        sdk: ["17.0.1", "^17.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno }}
      - name: Compile public entrypoints and execute isolated consumers
        env:
          STELLAR_SDK_VERSION: ${{ matrix.sdk }}
        run: deno task check:consumers:deno

  browser_compatibility:
    name: consumer / browsers / SDK ${{ matrix.sdk }}
    needs: prepare_consumers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["17.0.1", "^17.0.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: consumers-${{ matrix.sdk }}
          path: ${{ runner.temp }}/consumers
      - name: Run real Chromium, Firefox, and WebKit consumers
        env:
          TYPESCRIPT_VERSION: "6.0.3"
        run: deno task check:consumers:npm "${{ runner.temp }}/consumers" --browsers
      - name: Test browser consumer failure diagnostics and cleanup
        run: deno task test:browser-runner

  core_compatibility:
    name: consumer / released Core ranges / SDK ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["17.0.1", "^17.0.1"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - name: Check minimum Core and historical dependent release trees
        env:
          STELLAR_SDK_VERSION: ${{ matrix.sdk }}
        run: deno task check:consumers:dependencies

  package_tests:
    name: test / ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            path: core
            test_flags: --parallel
          - package: webauth
            path: webauth
            test_flags: --parallel
          - package: identicon
            path: identicon
            test_flags: --parallel
          - package: rpc-streamer
            path: rpc-streamer
            # Both Mainnet suites share the public archive provider. Avoid
            # concurrent requests from separate test-file workers.
            test_flags: ""
          - package: plugin-fee-bump
            path: plugins/fee-bump
            test_flags: --parallel
          - package: plugin-channel-accounts
            path: plugins/channel-accounts
            test_flags: --parallel
          - package: plugin-sep29
            path: plugins/sep29
            test_flags: --parallel
          - package: test-tooling
            path: test-tooling
            test_flags: --parallel

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Run ${{ matrix.package }} tests
        run: >-
          deno test -A --clean ${{ matrix.test_flags }}
          --coverage=coverage/${{ matrix.package }} --coverage-raw-data-only
          ${{ matrix.path }}

      - name: Upload ${{ matrix.package }} coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: coverage/${{ matrix.package }}/*.json
          if-no-files-found: error
          retention-days: 1

  build_verification_tests:
    name: test / build-verification / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: local
            test_flags: >-
              --parallel
              --ignore=build-verification/src/network-targets.integration.test.ts
              --ignore=build-verification/src/build-verification.testnet.integration.test.ts
              --ignore=build-verification/src/public-sources.integration.test.ts
            test_paths: build-verification
          - shard: quickstart
            test_flags: ""
            test_paths: build-verification/src/network-targets.integration.test.ts
          - shard: external
            test_flags: --parallel
            test_paths: >-
              build-verification/src/build-verification.testnet.integration.test.ts
              build-verification/src/public-sources.integration.test.ts

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Run build-verification ${{ matrix.shard }} tests
        run: >-
          deno test -A --clean ${{ matrix.test_flags }}
          --coverage=coverage/build-verification-${{ matrix.shard }}
          --coverage-raw-data-only ${{ matrix.test_paths }}

      - name: Upload build-verification ${{ matrix.shard }} coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-build-verification-${{ matrix.shard }}
          path: coverage/build-verification-${{ matrix.shard }}/*.json
          if-no-files-found: error
          retention-days: 1

  complexity:
    name: quality / complexity
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Generate unit coverage
        run: deno task test:unit

      - name: Generate unit coverage report
        run: deno coverage --lcov --output=coverage.lcov coverage

      - name: Enforce CRAP threshold
        run: deno task check:crap

  coverage:
    name: coverage
    needs: [package_tests, build_verification_tests]
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.7.11

      - name: Download package coverage profiles
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Prime instrumented source cache
        run: >-
          deno test -A
          --filter='__coverage_cache_prime_never_matches__'
          --coverage=coverage-prime --coverage-raw-data-only
          core build-verification identicon webauth rpc-streamer
          plugins/fee-bump plugins/channel-accounts plugins/sep29 test-tooling

      - name: Generate aggregate coverage report
        run: deno coverage --lcov --output=coverage.lcov coverage/coverage-*

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.lcov
          flags: all-tests
          name: codecov-aggregate
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: test
    if: ${{ always() }}
    needs: [
      quality,
      compatibility,
      deno_compatibility,
      browser_compatibility,
      core_compatibility,
      complexity,
      package_tests,
      build_verification_tests,
      coverage,
    ]
    runs-on: ubuntu-latest

    steps:
      - name: Require every CI job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          DENO_COMPATIBILITY_RESULT: ${{ needs.deno_compatibility.result }}
          BROWSER_COMPATIBILITY_RESULT: ${{ needs.browser_compatibility.result }}
          CORE_COMPATIBILITY_RESULT: ${{ needs.core_compatibility.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
          PACKAGE_TESTS_RESULT: ${{ needs.package_tests.result }}
          BUILD_VERIFICATION_TESTS_RESULT: ${{ needs.build_verification_tests.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$COMPATIBILITY_RESULT" = "success"
          test "$DENO_COMPATIBILITY_RESULT" = "success"
          test "$BROWSER_COMPATIBILITY_RESULT" = "success"
          test "$CORE_COMPATIBILITY_RESULT" = "success"
          test "$COMPLEXITY_RESULT" = "success"
          test "$PACKAGE_TESTS_RESULT" = "success"
          test "$BUILD_VERIFICATION_TESTS_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
