[package]
name = "colibri-declaration-emitter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
deno_ast = { version = "=0.53.2", features = ["emit"] }
deno_graph = { version = "=0.111.0", features = ["fast_check"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[workspace]
